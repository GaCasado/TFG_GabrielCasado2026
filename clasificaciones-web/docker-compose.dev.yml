# Override SOLO para desarrollo local: añade un MySQL desechable, sembrado
# con database/schema.sql y database/sample_data.sql (unas pocas filas de
# ejemplo, no el dataset real).
#
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# No se usa en producción: allí SQLPage debe apuntar a un MySQL ya existente
# mediante DATABASE_URL en tu .env, sin este fichero.

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      # MySQL ejecuta automáticamente, en orden alfabético, los .sql que
      # encuentre aquí la primera vez que se crea el volumen de datos.
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/sample_data.sql:/docker-entrypoint-initdb.d/02-sample_data.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  sqlpage:
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SQLPAGE_DATABASE_URL: mysql://${MYSQL_USER}@mysql:3306/${MYSQL_DATABASE}
      SQLPAGE_DATABASE_PASSWORD: ${MYSQL_PASSWORD}
      SQLPAGE_ENVIRONMENT: development

volumes:
  mysql-data:
